<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun Tiara 🎂</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #ffeaf4, #fff0f5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    max-width: 400px;
}

h1 {
    color: #ff4d88;
}

p {
    line-height: 1.6;
    color: #555;
}

button {
    padding: 10px 25px;
    margin-top: 20px;
    border: none;
    border-radius: 25px;
    background-color: #ff4d88;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
}

.confetti {
    position: absolute;
    font-size: 20px;
    animation: fall 5s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Hai Tiara 🎀</h1>
    <p>Aku punya sesuatu kecil untuk kamu hari ini…</p>
    <button onclick="bukaKado()">Buka 🎁</button>
</div>

<script>

function bukaKado() {
    const card = document.getElementById("card");

    document.body.style.background = "linear-gradient(135deg, #ffb6d9, #ffd6ec, #fff0f7)";

    card.innerHTML = `
    <h1 style="animation: fadeIn 1.5s ease-in-out;">Selamat Ulang Tahun Tiara 🎂</h1>
    <p style="animation: fadeIn 2s ease-in-out;">
    Tiara,<br><br>

    Hari ini adalah hari dimana dunia beruntung karena kamu lahir.<br><br>

    Aku cuma mau bilang…  
    kamu itu spesial dengan cara kamu sendiri.  
    Senyummu, caramu cerita, bahkan mood kamu yang kadang berubah-ubah —  
    semuanya bikin kamu jadi kamu.<br><br>

    Semoga di umur yang baru ini  
    kamu lebih bahagia,  
    lebih percaya diri,  
    dan lebih dekat sama semua hal yang kamu impikan.<br><br>

    Jangan pernah ngerasa kamu kurang.  
    Kamu cukup. Kamu berarti.  
    Dan kamu pantas dapet hal-hal baik dalam hidup kamu.<br><br>

    Selamat ulang tahun ya, Tiara. 🎀✨  
    Semoga tahun ini jadi salah satu tahun terbaik buat kamu. 💖
    </p>
    `;

    mulaiConfetti();
}

function mulaiConfetti(){
    setInterval(() => {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.innerHTML = "🎉";
        confetti.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5000);
    }, 300);
}

</script>

</body>
</html>
